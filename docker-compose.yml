# 僅供本機開發與測試。postgres_* volume 只保存資料庫檔，不是被匯入的 Git repo。
# 帳密為本機用的假值；請勿用於任何共用或正式環境。
#
# 第二階段的背景工作服務都用 profile，`docker compose up -d --wait db db-test` 的既有用法不受影響：
#   開發堆疊（profile jobs）：   redis、worker、dispatcher
#   測試堆疊（profile jobs-test）：redis-test、worker-test、dispatcher-test（由 pytest 的 stack 測試管理）
# 映像由 `docker compose --profile jobs build` 建置，worker 與 dispatcher 共用同一個映像、指令不同。

# worker 與 dispatcher 共用的映像與加固設定（非 root UID 10001、唯讀根檔案系統、無 capability）
x-job-service: &job-service
  build:
    context: .
    dockerfile: docker/worker.Dockerfile
  image: repopilot-worker:stage02-slice3
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

# 兩個堆疊相同的環境變數：路徑是「容器內」的掛載點（主機路徑只出現在 WORKER_PATH_MAPPINGS）
x-job-env: &job-env
  PYTHONUNBUFFERED: "1"
  REPOSITORY_ROOTS: /mnt/repos
  MANAGED_REPOS_DIR: /mnt/managed

x-postgres: &postgres
  build:
    context: ./docker
    dockerfile: postgres.Dockerfile
  image: repopilot-postgres:17-pgvector0.8.1

services:
  db:
    <<: *postgres
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot_dev
      POSTGRES_DB: repopilot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    <<: *postgres
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot_test
      POSTGRES_DB: repopilot_test
    ports:
      - "127.0.0.1:5433:5432"
    # 測試資料庫不保存資料，每次重建都是乾淨環境
    tmpfs:
      - /var/lib/postgresql/data
    # R5（第二階段切片 3）：測試資料庫只在測試網路上，與開發用的 `db`（default 網路）互相看不到。
    # 對主機的 5433 埠對應不受網路影響
    networks: [jobs-test]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- 開發堆疊（profile jobs）----
  # 啟動：docker compose --profile jobs up -d --wait db redis dispatcher worker
  # 需要 .env.worker（見 .env.worker.example）與 .env 內的 WORKER_*_HOST_DIR（主機路徑，用正斜線）。
  redis:
    image: redis:7.4.12-alpine3.22
    profiles: ["jobs"]
    # 只做 broker：不對主機開埠、不得驅逐鍵（Celery 官方文件要求）
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis_dev_data:/data
    networks: [jobs]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dispatcher:
    <<: *job-service
    profiles: ["jobs"]
    command: ["python", "-m", "repopilot.jobs.dispatcher"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *job-env
      # 預設連開發資料庫（容器內以服務名 db 連線，不是 localhost）；煙霧測試可用拋棄式資料庫覆寫
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+psycopg://repopilot:repopilot_dev@db:5432/repopilot}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: repopilot.jobs
      CELERY_GLOBAL_KEYPREFIX: "repopilot:"
    env_file:
      - path: .env.worker
        required: false
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-m", "repopilot.jobs.healthcheck", "dispatcher"]
      interval: 10s
      timeout: 20s
      retries: 6
      start_period: 40s
    networks: [default, jobs]

  worker:
    <<: *job-service
    profiles: ["jobs"]
    command:
      - celery
      - -A
      - repopilot.jobs.worker
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - --without-gossip
      - --without-mingle
      - --hostname=worker@%h
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      <<: *job-env
      DATABASE_URL: ${WORKER_DATABASE_URL:-postgresql+psycopg://repopilot:repopilot_dev@db:5432/repopilot}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_QUEUE_NAME: repopilot.jobs
      CELERY_GLOBAL_KEYPREFIX: "repopilot:"
      # 選用的 GPU runtime 的 socket；沒啟動 embedding-gpu 時工作選 GPU 會被 API 事先拒絕
      EMBEDDING_GPU_SOCKET_PATH: /run/embed-gpu/runtime.sock
      # 主機路徑 ↔ 容器路徑；host 用正斜線（D:/repos），與下方 bind mount 的來源相同。
      # 預設的相對路徑不是合法的主機路徑，worker 會在啟動時明確拒絕（請在 .env 設定兩個 *_HOST_DIR）
      WORKER_PATH_MAPPINGS: '[{"host":"${WORKER_REPOSITORIES_HOST_DIR:-./.test-repos}","container":"/mnt/repos","mode":"ro"},{"host":"${WORKER_MANAGED_HOST_DIR:-./.test-managed}","container":"/mnt/managed","mode":"rw"}]'
    env_file:
      - path: .env.worker
        required: false
    # 使用者的本機 repo 唯讀（掛載層強制）；受管目錄（GitHub clone）讀寫
    volumes:
      - type: bind
        source: ${WORKER_REPOSITORIES_HOST_DIR:-./.test-repos}
        target: /mnt/repos
        read_only: true
      - type: bind
        source: ${WORKER_MANAGED_HOST_DIR:-./.test-managed}
        target: /mnt/managed
      - type: volume
        source: embedding_socket
        target: /run/embed
        read_only: true
      - type: volume
        source: embedding_gpu_socket
        target: /run/embed-gpu
        read_only: true
    # Celery 的 warm shutdown 會等手上的任務；超過寬限期被 SIGKILL 時，租約過期後由復原掃描接手
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "python", "-m", "repopilot.jobs.healthcheck", "worker"]
      interval: 10s
      timeout: 20s
      retries: 6
      start_period: 40s
    networks: [default, jobs]

  embedding-init:
    image: repopilot-worker:stage02-slice3
    profiles: ["embedding"]
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c", "chown 10001:10001 /run/embed && chmod 700 /run/embed"]
    volumes:
      - embedding_socket:/run/embed

  embedding:
    build:
      context: .
      dockerfile: docker/embedding.Dockerfile
    image: repopilot-embedding:stage03
    profiles: ["embedding"]
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      embedding-init: { condition: service_completed_successfully }
    command:
      - python
      - -m
      - repopilot.embedding.isolated_runtime
      - --model
      - /model/model.gguf
      - --model-sha256
      - ${EMBEDDING_MODEL_SHA256:-}
      - --socket
      - /run/embed/runtime.sock
      # 只影響速度，不改變 embedding 設定識別（見 README「隔離 embedding 服務」）。
      # 這個服務固定走 CPU；GPU 是另一個服務 embedding-gpu（profile embedding-gpu）
      - --threads
      - ${EMBEDDING_THREADS:-8}
      - --gpu-layers
      - "0"
    volumes:
      - type: bind
        source: ${EMBEDDING_MODEL_HOST_PATH:-./.embedding-model-not-configured}
        target: /model/model.gguf
        read_only: true
        bind:
          create_host_path: false
      - embedding_socket:/run/embed
    healthcheck:
      test: ["CMD", "python", "-m", "repopilot.embedding.socket_health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  # 選用：GPU runtime（需 NVIDIA container toolkit／Docker Desktop＋WSL2）。與 CPU 的 embedding 同一份
  # 映像與模型、同樣無網路，只是另一個容器與私有 socket；沒有可用 GPU 時它會啟動失敗，不影響 CPU 服務。
  # 啟動：docker compose --profile embedding --profile embedding-gpu up -d --wait embedding-gpu
  embedding-gpu-init:
    image: repopilot-worker:stage02-slice3
    profiles: ["embedding-gpu"]
    user: "0:0"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c", "chown 10001:10001 /run/embed && chmod 700 /run/embed"]
    volumes:
      - embedding_gpu_socket:/run/embed

  embedding-gpu:
    image: repopilot-embedding:stage03
    profiles: ["embedding-gpu"]
    user: "10001:10001"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      embedding-gpu-init: { condition: service_completed_successfully }
    command:
      - python
      - -m
      - repopilot.embedding.isolated_runtime
      - --model
      - /model/model.gguf
      - --model-sha256
      - ${EMBEDDING_MODEL_SHA256:-}
      - --socket
      - /run/embed/runtime.sock
      - --threads
      - ${EMBEDDING_THREADS:-8}
      - --gpu-layers
      - "99"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - type: bind
        source: ${EMBEDDING_MODEL_HOST_PATH:-./.embedding-model-not-configured}
        target: /model/model.gguf
        read_only: true
        bind:
          create_host_path: false
      - embedding_gpu_socket:/run/embed
    healthcheck:
      test: ["CMD", "python", "-m", "repopilot.embedding.socket_health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  embedding-gateway:
    image: repopilot-worker:stage02-slice3
    profiles: ["embedding"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    command: ["python", "-m", "repopilot.embedding.gateway"]
    depends_on:
      embedding: { condition: service_healthy }
    environment:
      EMBEDDING_MODEL_SHA256: ${EMBEDDING_MODEL_SHA256:-}
      EMBEDDING_RUNTIME_SHA256: ${EMBEDDING_RUNTIME_SHA256:-}
      EMBEDDING_GATEWAY_TOKEN: ${EMBEDDING_GATEWAY_TOKEN:-}
      EMBEDDING_SOCKET_PATH: /run/embed/runtime.sock
      EMBEDDING_GPU_SOCKET_PATH: /run/embed-gpu/runtime.sock
    volumes:
      - type: volume
        source: embedding_socket
        target: /run/embed
        read_only: true
      - type: volume
        source: embedding_gpu_socket
        target: /run/embed-gpu
        read_only: true
    networks: [embedding-gateway]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  embedding-proxy:
    image: repopilot-worker:stage02-slice3
    profiles: ["embedding"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    command: ["python", "-m", "repopilot.embedding.gateway_proxy"]
    depends_on:
      embedding-gateway: { condition: service_healthy }
    ports:
      - "127.0.0.1:${EMBEDDING_GATEWAY_PORT:-18763}:8765"
    networks: [embedding-ingress, embedding-gateway]

  # ---- 測試堆疊（profile jobs-test）----
  # 由 tests/integration/stack 的 pytest fixture 啟動與停止（會設定 WORKER_TEST_*_HOST_DIR 為專案內的
  # .test-repos／.test-managed 絕對路徑）。連 db-test，不連開發的 db、redis；佇列名稱與 Redis 鍵前綴
  # 與開發堆疊不同。租約、掃描週期調得很短，讓故障注入測試在數十秒內完成（只在這個堆疊，數值皆未實測）。
  redis-test:
    image: redis:7.4.12-alpine3.22
    profiles: ["jobs-test"]
    # 測試用：無持久化、tmpfs，與開發的 redis 完全隔離（不同網路與名稱）
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    networks: [jobs-test]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  dispatcher-test:
    <<: *job-service
    profiles: ["jobs-test"]
    command: ["python", "-m", "repopilot.jobs.dispatcher"]
    depends_on:
      db-test: { condition: service_healthy }
      redis-test: { condition: service_healthy }
    environment:
      <<: *job-env
      DATABASE_URL: postgresql+psycopg://repopilot:repopilot_test@db-test:5432/repopilot_test
      CELERY_BROKER_URL: redis://redis-test:6379/0
      CELERY_QUEUE_NAME: repopilot-test.jobs
      CELERY_GLOBAL_KEYPREFIX: "repopilot-test:"
      JOB_LEASE_SECONDS: "12"
      JOB_HEARTBEAT_SECONDS: "3"
      JOB_RETRY_BASE_SECONDS: "1"
      JOB_RETRY_MAX_SECONDS: "4"
      DISPATCH_POLL_SECONDS: "0.5"
      RECOVERY_SCAN_SECONDS: "1"
      DISPATCH_RESEND_AFTER_SECONDS: "15"
      SERVICE_HEARTBEAT_SECONDS: "3"
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-m", "repopilot.jobs.healthcheck", "dispatcher"]
      interval: 3s
      timeout: 15s
      retries: 20
      start_period: 5s
    networks: [jobs-test]

  worker-test:
    <<: *job-service
    profiles: ["jobs-test"]
    # 第二階段切片 5：同一個容器內另外啟動假 GitHub（tests/fake_remote/server.py，只用標準函式庫，綁定
    # 127.0.0.1），所以 GITHUB_*_BASE_URL 是迴圈位址而通過設定驗證，不需要放寬任何正式設定。`exec`
    # 讓 celery 成為 PID 1（SIGTERM 與 docker stop 的行為與其他 worker 相同）；容器被殺時假伺服器一起消失
    command:
      - sh
      - -c
      - >-
        python /opt/fake_remote/server.py &
        exec celery -A repopilot.jobs.worker worker --loglevel=INFO --concurrency=2
        --without-gossip --without-mingle --hostname=worker@%h
    depends_on:
      db-test: { condition: service_healthy }
      redis-test: { condition: service_healthy }
    environment:
      <<: *job-env
      DATABASE_URL: postgresql+psycopg://repopilot:repopilot_test@db-test:5432/repopilot_test
      CELERY_BROKER_URL: redis://redis-test:6379/0
      CELERY_QUEUE_NAME: repopilot-test.jobs
      CELERY_GLOBAL_KEYPREFIX: "repopilot-test:"
      WORKER_PATH_MAPPINGS: '[{"host":"${WORKER_TEST_REPOS_HOST_DIR:-./.test-repos}","container":"/mnt/repos","mode":"ro"},{"host":"${WORKER_TEST_MANAGED_HOST_DIR:-./.test-managed}","container":"/mnt/managed","mode":"rw"}]'
      JOB_LEASE_SECONDS: "12"
      JOB_HEARTBEAT_SECONDS: "3"
      JOB_RETRY_BASE_SECONDS: "1"
      JOB_RETRY_MAX_SECONDS: "4"
      SERVICE_HEARTBEAT_SECONDS: "3"
      # GitHub（切片 5）：假 GitHub 在本容器的 127.0.0.1；token 解密金鑰由測試每次執行時隨機產生
      # （WORKER_TEST_TOKEN_KEY，不入版控；沒設定時為空＝worker 不能解密 token）
      TOKEN_ENCRYPTION_KEY: ${WORKER_TEST_TOKEN_KEY:-}
      GITHUB_API_BASE_URL: http://127.0.0.1:18765
      GITHUB_CLONE_BASE_URL: http://127.0.0.1:18765
      FAKE_REMOTE_DIR: /mnt/remote
      GITHUB_CLONE_TIMEOUT_SECONDS: "60"
      # 取消與進度輪詢調短（只在測試堆疊，皆未實測）；孤兒暫存目錄門檻 90 秒（須大於 clone 逾時）
      GIT_POLL_SECONDS: "0.5"
      CLONE_PROGRESS_SECONDS: "1"
      MANAGED_TEMP_ORPHAN_SECONDS: "90"
    volumes:
      - type: bind
        source: ${WORKER_TEST_REPOS_HOST_DIR:-./.test-repos}
        target: /mnt/repos
        read_only: true
      - type: bind
        source: ${WORKER_TEST_MANAGED_HOST_DIR:-./.test-managed}
        target: /mnt/managed
      # 假 GitHub 的資料目錄（bare repo、api.json、control.json、requests.log）：測試在主機端寫入
      - type: bind
        source: ${WORKER_TEST_REMOTE_HOST_DIR:-./.test-remote}
        target: /mnt/remote
      - type: bind
        source: ./tests/fake_remote
        target: /opt/fake_remote
        read_only: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "python", "-m", "repopilot.jobs.healthcheck", "worker"]
      interval: 3s
      timeout: 15s
      retries: 20
      start_period: 5s
    networks: [jobs-test]

networks:
  jobs:
  embedding-gateway:
    internal: true
  embedding-ingress:
  # 測試堆疊專用網路：db-test、redis-test、worker-test、dispatcher-test 只在這裡（R5）
  jobs-test:

volumes:
  postgres_dev_data:
  redis_dev_data:
  embedding_socket:
  embedding_gpu_socket:
