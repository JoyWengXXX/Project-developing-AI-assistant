[project]
name = "repopilot"
version = "0.1.0"
description = "AI 輔助專案客製化平台（第一階段：Repo 管理與固定版本匯入）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.159.1,<0.160",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "sqlalchemy>=2.1.6,<2.2",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S"]
# 專案以繁體中文撰寫註解與 docstring，全形標點不是混淆字元
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
]
