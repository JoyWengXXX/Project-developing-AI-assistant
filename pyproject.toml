[project]
name = "repopilot"
version = "0.1.0"
description = "AI 輔助專案客製化平台（第一階段：Repo 管理與固定版本匯入）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1,<2",
    # 第四階段 4-1a：生成模型供應商（Anthropic）轉接層
    "anthropic>=2.10.0,<3",
    # 第二階段切片 3：背景工作。Celery 只做 worker 與 dispatcher 的發布端（`send_task`），Redis 只做 broker，
    # 事實來源是 PostgreSQL；`redis` extra 帶入 kombu 的 Redis transport 與 redis-py。純 Python wheel，
    # worker 在 Linux 容器執行（Celery 官方不支援 Windows），API 程序不匯入也不連線。5.7.x 是支援 3.11 的最後一版
    "celery[redis]>=5.7.0,<5.8",
    # 第一階段切片 5c：GitHub token 靜態加密（Fernet）
    "cryptography>=50.0.2,<51",
    "fastapi>=0.159.1,<0.160",
    # 第一階段切片 5c：呼叫 GitHub API（原為開發依賴，測試仍用 TestClient／MockTransport）
    "httpx>=0.28.1,<0.29",
    # 第三階段：PostgreSQL pgvector 的 SQLAlchemy 型別
    "pgvector==0.5.1",
    "psycopg[binary]>=3.3.6,<4",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "sqlfluff==4.5.0",
    "sqlalchemy>=2.1.6,<2.2",
    "tree-sitter>=0.26.1,<0.27",
    "tree-sitter-c-sharp>=0.23.5,<0.24",
    "tree-sitter-go==0.25.0",
    "tree-sitter-java==0.23.5",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-typescript==0.23.2",
    "uvicorn[standard]>=0.54.0,<0.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S"]
# 專案以繁體中文撰寫註解與 docstring，全形標點不是混淆字元
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S105：測試中的假 token（TESTONLY）與 `token_type == "classic"` 之類的比對會被誤判為寫死的密碼
"tests/**" = ["S101", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

# Celery／kombu 沒有型別標記（py.typed）；只在 worker／dispatcher 的入口使用，型別視為 Any
[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: 啟動真實 uvicorn 子程序的測試（每次啟動數秒）；預設會執行，只想跑快速測試時用 -m \"not slow\"",
    "stack: 需要真實測試堆疊（db-test＋redis-test＋worker-test＋dispatcher-test 容器）的測試；預設會執行，堆疊無法啟動時明確失敗（不跳過）；只想跑不需要容器的測試時用 -m \"not stack\"",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
]
